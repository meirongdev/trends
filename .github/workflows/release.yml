name: release

# CI 只产出镜像;部署交给 homelab 的 ArgoCD + argocd-image-updater(GitOps 边界)。
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write          # 推 ghcr 必需

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/meirongdev/trends
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Oracle Ampere A1 = ARM64 是唯一的运行目标;amd64 不是为了跑,而是**为了能被扫**:
          # trivy-operator 的扫描 Job 跑 `trivy image <ref>` 且**不带 --platform**,
          # trivy 远程解析默认 linux/amd64 —— 索引里没有 amd64 子项就直接 FATAL
          # (`no child with platform linux/amd64 in index`),该镜像于是**从来没被扫过**,
          # 而告警只数现存报告 → 漏扫静默表现为"0 条 Critical"。
          # 2026-08-05 清 oracle 73 条 Critical 时发现本镜像正是这么漏掉的。
          # chart 0.33.1 没有平台开关(extraEnv 只进 operator 不进扫描 Job),故只能出多架构。
          # 代价很小:前端在 BUILDPLATFORM 上只构一次,Go 是 CGO_ENABLED=0 交叉编译(无 QEMU),
          # 运行时 distroless/static 本身就是多架构 —— 只多一次 go build。
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
